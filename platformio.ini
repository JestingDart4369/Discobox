; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Environments
;   uno_r4_wifi        RUN   — normal firmware, with Logger::debugLog() output
;   uno_r4_wifi_debug  DEBUG — same firmware, debug build + session saved to a log file
;   uno_r4_wifi_test   TEST  — on-device tests in test/test_hw_*  (board plugged in)
;   native             TEST  — laptop unit tests (no board needed)
;
; Commands
;   pio run -t upload                       → RUN on the board
;   pio run -e uno_r4_wifi_debug -t upload  → DEBUG on the board
;   pio test -e uno_r4_wifi_test            → on-device tests
;   pio test -e native                      → laptop tests
;   pio device monitor                      → serial monitor (settings below)
[platformio]
default_envs = uno_r4_wifi

; ── Shared by EVERY environment ─────────────────────────────────────────────
; monitor_speed   must match Serial.begin(...) in main.cpp
; monitor_echo    shows what you type
; send_on_enter   sends the whole line on Enter (not every keystroke)
; time            timestamp on every line
; monitor_eol     LF only
[env]
monitor_speed = 9600
monitor_echo = yes
monitor_eol = LF
monitor_filters =
  send_on_enter
  time

; ── RUN ─────────────────────────────────────────────────────────────────────
[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps =
  fastled/FastLED@3.7.3
  dfrobot/DFRobotDFPlayerMini
build_flags =
  -Wall
  -DDEBUG_ENABLED
  ; buzzer notes via the R4's PwmOut instead of tone() -> volume levels 0..8
  ; (see lib/SongPlayer/SongPlayer.h and test/test_hw_buzzer_volume)
  -DBUZZER_PWM
; On the board only the hardware tests can run — the others need the
; laptop mocks (test/mocks). Inherited by the debug + test envs too.
test_framework = unity
test_filter = test_hw_*
test_speed = 115200

; ── DEBUG ───────────────────────────────────────────────────────────────────
; Everything from RUN + debug build (no optimisation, debug symbols).
; log2file also saves the session to a file.
[env:uno_r4_wifi_debug]
extends = env:uno_r4_wifi
build_type = debug
monitor_filters =
  send_on_enter
  time
  log2file

; ── TEST on the board ───────────────────────────────────────────────────────
; Runs only test/test_hw_*. src/main.cpp is NOT compiled in — each test has
; its own setup()/loop(). Close the serial monitor first (it blocks the port).
[env:uno_r4_wifi_test]
extends = env:uno_r4_wifi

; ── TEST on the laptop ──────────────────────────────────────────────────────
; test/mocks/Arduino.h              replaces the Arduino core
; test/mocks/DFRobotDFPlayerMini.h  replaces the DFPlayer library
; Each sub-directory of test/ is a separate test executable:
;   test/test_gesture_button/  — GestureButton gesture logic
;   test/test_dfplayer/        — DFPlayerController volume + playback state
;   test/test_song_player/     — speakerController step() / elapsed()
;   test/test_color_parse/     — ColorParse ("255 0 0", "255,0,0", "#ff0000")
;   test/test_shell_input/     — Shell: LineReader + Tokenizer
;   test/test_shell_args/      — Shell: global flags + ArgParser
;   test/test_shell_dispatch/  — Shell: lookup, help/man, -d -q -dry -t, fallback, ShellCheck
;   test/test_shell_aliases/   — Shell: action aliases (-p/--play), group defaults, help <name>
[env:native]
platform = native
test_framework = unity
test_ignore = test_hw_*
build_src_filter = -<*>
build_flags =
  -std=c++17
  -I ${PROJECT_DIR}/test/mocks
