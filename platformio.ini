; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Only build/upload the board env by default — native is test-only.
; Use: pio run            → builds uno_r4_wifi only
;      pio run -t upload  → uploads uno_r4_wifi only
;      pio test -e native → runs laptop unit tests
[platformio]
default_envs = uno_r4_wifi

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps =
  fastled/FastLED@3.7.3
  dfrobot/DFRobotDFPlayerMini
build_flags = -DDEBUG_ENABLED

; ── Native (laptop) test environment ────────────────────────────────────────
; Run with:  pio test -e native
;
; test/mocks/Arduino.h  replaces the real Arduino core so the tests compile
;   without any hardware or board toolchain installed.
; test/mocks/DFRobotDFPlayerMini.h  replaces the real DFPlayer library with
;   a controllable stub.
;
; Each sub-directory of test/ is a separate test executable:
;   test/test_gesture_button/  — GestureButton gesture logic
;   test/test_dfplayer/        — DFPlayerController volume + playback state
;   test/test_song_player/     — speakerController step() / elapsed()
[env:native]
platform = native
test_framework = unity
; Exclude src/main.cpp from native builds — tests have their own main(),
; and main.cpp pulls in FastLED / SPI / Arduino board headers that don't
; exist on the host machine.
build_src_filter = -<*>
build_flags =
  -std=c++17
  -I ${PROJECT_DIR}/test/mocks
